<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ToDo Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .text-strikethrough{
            text-decoration: line-through;
            color: green;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class = "mt-5 text-center"> ToDo Application</h1>

    <!-- Selected user's name -->
    <h3 class = "text-center">
        Welcome, <span th:text="${user.name}"></span>!
    </h3>
    <!-- today's date -->
    <p class = "text-center text-muted" th:text="${today}"></p>
    <!-- back to profile -->
    <div class = "text-center mt-3">
        <a href="/users" class = "btn btn-outline-secondary btn-sm">
            Switch Profile
        </a>
    </div>

    <form th:action="@{/users/{userId}/tasks(uesrID=${user.id})}"
          method = "post" class = "row mt-3">
        <div class = "col-md-10">
            <input class = "form-control form-control-lg"
                   type="text"
                   name="title"
                   placeholder="Add a new task...."
                   required>
        </div>
        <div class = "col-md-2">
            <button type="submit" class = "btn btn-primary btn-lg w-100">
                Add Task
            </button>
        </div>
    </form>
    <div class="mt-4">
        <th:block th:each="task: ${tasks}">
            <div class="card mb-2">
                <div class = "card-body d-flex justify-content-between slign-items-center">
                    <div>
                        <span th:classappend="${tasks.completed} ? 'text-strikethrough'"
                              th:text="${task.title}">
                            Task Title
                        </span>
                        <small class = "text-muted d-block"
                               th:if="${task.completed and task.completedAt!=null}"
                               th:text="'Done at ' + ${#temporals.format(task.completedAt, 'dd MMM yyyy, HH:mm')}"
                        </small>
                    </div>
                    <div>
                        <a th:href="@{/users/{userId}/tasks/{taskId}/toggle(userId=${user.id}, taskId=${task.id})}"
                           class = "btn btn-outline-danger btn-sm">
                            Delete
                        </a>
                    </div>
                </div>
            </div>
        </th:block>
    </div>
</div>

</body>
</html>
